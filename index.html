<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HỆ THỐNG KHẢO SÁT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
        .auth-tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 2px solid #e2e8f0; }
        .auth-tab { flex: 1; padding: 0.75rem; text-align: center; background: none; border: none; font-weight: 600; color: #64748b; cursor: pointer; transition: all 0.2s; }
        .auth-tab.active { color: #2563eb; border-bottom: 2px solid #2563eb; margin-bottom: -2px; }
        
        .logout-link { display: inline-block; padding: 0.6rem 1.8rem; background: #dc2626; border-radius: 8px; text-decoration: none; color: #fff; font-weight: 600; transition: background 0.2s; }
        .logout-link:hover { background: #b91c1c; }
        .sidebar-total-score { margin: 1rem 0 1.5rem; padding: 0.8rem; background: rgba(255,255,255,0.08); border-radius: 8px; }
        .total-score-label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; }
        .total-score-value { font-size: 1.8rem; font-weight: 700; color: #fff; }
        .total-score-value small { font-size: 0.9rem; color: #94a3b8; }
    </style>
</head>
<body>

    <!-- ============ MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ ============ -->
    <div class="auth-wrapper" id="authWrapper">
        <div class="auth-card">
            <div class="auth-brand"><i class="fas fa-bolt"></i> A GROUP</div>
            
            <!-- Tabs chuyển đổi -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tabLogin">Đăng nhập</button>
                <button type="button" class="auth-tab" id="tabRegister">Đăng ký</button>
            </div>

            <!-- FORM ĐĂNG NHẬP -->
            <form id="formLogin">
                <div class="form-group">
                    <label>Email / SĐT / Admin Username <span class="req">*</span></label>
                    <input type="text" id="login_email" placeholder="admin hoặc 23103xxx@ttn.edu.vn" required />
                </div>
                <div class="form-group">
                    <label>Mật khẩu <span class="req">*</span></label>
                    <input type="password" id="login_password" placeholder="Nhập mật khẩu" required />
                </div>
                <button type="submit" class="btn-primary"><i class="fas fa-sign-in-alt"></i> Đăng nhập</button>
            </form>

            <!-- FORM ĐĂNG KÝ (Mặc định tạo User, không có chọn Role) -->
            <form id="formRegister" style="display: none;">
                <div class="form-group">
                    <label>Họ và tên <span class="req">*</span></label>
                    <input type="text" id="reg_ho_ten" placeholder="Nguyễn Văn A" required />
                </div>
                <div class="form-group">
                    <label>Email hoặc Số điện thoại <span class="req">*</span></label>
                    <input type="text" id="reg_email" placeholder="vd: 23103xxx@ttn.edu.vn" required />
                </div>
                <div class="form-group">
                    <label>Mật khẩu <span class="req">*</span></label>
                    <input type="password" id="reg_password" placeholder="Tạo mật khẩu" required />
                </div>
                <div class="form-group">
                    <label>Khoá <span class="req">*</span></label>
                    <select id="id_khoa" required>
                        <option value="">-- Chọn khoá --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Lớp <span class="req">*</span></label>
                    <input type="text" id="id_lop" placeholder="Ví dụ: Công nghệ thông tin 1" required>
                </div>
                <button type="submit" class="btn-primary"><i class="fas fa-user-plus"></i> Đăng ký ngay</button>
            </form>

            <div class="auth-error" id="authError"></div>
        </div>
    </div>

    <!-- ============ GIAO DIỆN KHẢO SÁT (User) ============ -->
    <div class="app-wrapper" id="appWrapper" style="display:none;">
        <!-- Sidebar (Giữ nguyên cấu trúc cũ) -->
        <nav class="sidebar">
            <div class="sidebar-brand"><i class="fas fa-bolt"></i> A GROUP</div>
            <div id="box-tong-diem" class="sidebar-total-score">
                <div class="total-score-label">ĐIỂM DMS TỔNG HỢP</div>
                <div class="total-score-value"><span id="txt-tong-diem">0.00</span><small>/5</small></div>
            </div>
            <div class="sidebar-title">Bộ Tiêu Chí</div>
            <ul class="menu" id="menuList"></ul>
            <div class="sidebar-footer">
                <i class="fas fa-user"></i> <span id="sidebarUser"></span>
                <a href="#" id="logoutBtn" class="logout-btn" style="display:block;margin-top:0.8rem;padding:0.4rem 0.8rem;background:#dc2626;color:#fff;border-radius:6px;text-align:center;text-decoration:none;font-size:0.85rem;border:none;cursor:pointer;">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </a>
            </div>
        </nav>

        <main class="main-content" id="mainContent">
            <div class="content-header">
                <h1 id="pageTitle"><i class="fas fa-circle-exclamation" id="pageIcon"></i><span id="titleText">Đang tải...</span></h1>
                <div class="progress-wrap">
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                    <span class="progress-text" id="progressText">0/0 câu đã trả lời</span>
                </div>
            </div>
            <div class="content-card" id="contentCard">
                <div id="dynamicContent" class="fade-enter">
                    <div class="loading"><i class="fas fa-spinner fa-pulse"></i> Đang tải câu hỏi...</div>
                </div>
            </div>
            <div class="submit-bar">
                <button class="btn-primary" id="submitBtn" disabled><i class="fas fa-paper-plane"></i> Nộp khảo sát</button>
            </div>
        </main>
    </div>

    <!-- ============ MÀN HÌNH HOÀN THÀNH ============ -->
    <div class="done-wrapper" id="doneWrapper" style="display:none;">
        <div class="done-card">
            <i class="fas fa-circle-check"></i>
            <h2>Cảm ơn bạn đã hoàn thành khảo sát!</h2>
            <p id="doneMessage">Kết quả của bạn đã được ghi nhận thành công.</p>
            <div class="result-panel" id="resultPanel" style="display:none;">
                <div class="result-dms"><span class="result-dms-label">Điểm Trưởng thành Số tổng hợp (DMS)</span><span class="result-dms-value" id="dmsValue">–</span></div>
                <div class="result-pillars" id="resultPillars"></div>
            </div>
            <div style="margin-top: 2rem; border-top: 1px solid #e5e7eb; padding-top: 1.5rem;">
                <a href="api/logout.php" class="logout-link"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
            </div>
        </div>
    </div>

    <script>
        // ========== XỬ LÝ CHUYỂN TAB ==========
        document.getElementById('tabLogin').addEventListener('click', function() {
            document.getElementById('tabLogin').classList.add('active');
            document.getElementById('tabRegister').classList.remove('active');
            document.getElementById('formLogin').style.display = 'block';
            document.getElementById('formRegister').style.display = 'none';
        });
        document.getElementById('tabRegister').addEventListener('click', function() {
            document.getElementById('tabRegister').classList.add('active');
            document.getElementById('tabLogin').classList.remove('active');
            document.getElementById('formRegister').style.display = 'block';
            document.getElementById('formLogin').style.display = 'none';
            if(document.getElementById('id_khoa').children.length === 1) loadKhoa();
        });

        // Hàm load danh sách khoá
        async function loadKhoa() {
            try {
                const res = await fetch('api/get_khoa_lop.php');
                const data = await res.json();
                if(data.success) {
                    const select = document.getElementById('id_khoa');
                    data.khoa.forEach(k => {
                        const opt = document.createElement('option');
                        opt.value = k.id; opt.textContent = k.ten_khoa;
                        select.appendChild(opt);
                    });
                }
            } catch(e) { console.error("Lỗi load khoa", e); }
        }

        // Load khoa khi tải trang
        document.addEventListener('DOMContentLoaded', loadKhoa);
    </script>
    
    <script src="assets/js/app.js"></script>
</body>
</html>
